# ========================================================
# RENDER BLUEPRINT SPECIFICATION (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec
# ========================================================
#
# The PostgreSQL instance is managed outside this file on purpose.
#
# This blueprint used to declare two databases (nodus-sandbox-db and
# nodus-prod-db) and wire each service to one of them. Neither was ever
# created: both services were pointed by hand at the single instance that
# actually exists (nodus-db / nodus_4r53). A Blueprint sync would therefore
# have created two empty databases and repointed both services at them, which
# looks exactly like every user, organization, and API key disappearing.
#
# DATABASE_URL is `sync: false` below so a sync leaves it untouched. Provision
# and rotate the database deliberately, not as a side effect of a deploy.

services:
  # ------------------------------------------------------
  # 1. DEVELOPMENT / STAGING ENVIRONMENT (Branch: dev)
  # ------------------------------------------------------
  - type: web
    name: nodus-dev
    runtime: docker
    plan: free
    region: oregon
    branch: dev
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NODUS_DEPLOYMENT_ENV
        value: sandbox
      - key: WALRUS_DIRECT_TESTNET_ENABLED
        value: "true"
      # Managed by hand; see the note at the top of this file.
      - key: DATABASE_URL
        sync: false
      - key: CONSOLE_API_BASE_URL
        value: https://api.console.walrus.xyz
      - key: CONSOLE_MCP_ALLOWED_DIRS
        value: /app
      - key: CONSOLE_API_KEY
        sync: false
      - key: CONSOLE_SERVICE_PRIVATE_KEY
        sync: false
      - key: CONSOLE_WEB_ACCOUNT_ADDRESS
        sync: false
      - key: NODUS_ALLOWED_ORIGINS
        sync: false
      - key: NODUS_PROVISIONING_ADMIN_TOKEN
        sync: false
      - key: NODUS_TENANT_PROVISIONER_URL
        sync: false
      - key: NODUS_TENANT_PROVISIONER_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ------------------------------------------------------
  # 2. PRODUCTION ENVIRONMENT (Branch: main)
  # ------------------------------------------------------
  - type: web
    name: nodus-prod
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # This deployment intentionally runs as sandbox so the direct Walrus Testnet
      # path is available for the demo. Production mode force-disables Testnet in
      # walrus-direct-adapter.js, so the two settings always move together. This
      # also allows local sandbox fallbacks when the Console is unavailable, which
      # is a deliberate availability trade for the demo.
      - key: NODUS_DEPLOYMENT_ENV
        value: sandbox
      - key: WALRUS_DIRECT_TESTNET_ENABLED
        value: "true"
      # Managed by hand; see the note at the top of this file.
      - key: DATABASE_URL
        sync: false
      - key: CONSOLE_API_BASE_URL
        value: https://api.console.walrus.xyz
      - key: CONSOLE_MCP_ALLOWED_DIRS
        value: /app
      - key: CONSOLE_API_KEY
        sync: false
      - key: CONSOLE_SERVICE_PRIVATE_KEY
        sync: false
      - key: CONSOLE_WEB_ACCOUNT_ADDRESS
        sync: false
      - key: NODUS_ALLOWED_ORIGINS
        sync: false
      - key: NODUS_PROVISIONING_ADMIN_TOKEN
        sync: false
      - key: NODUS_TENANT_PROVISIONER_URL
        sync: false
      - key: NODUS_TENANT_PROVISIONER_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
