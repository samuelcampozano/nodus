name: nodus-local-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nodus_local_tests
      POSTGRES_USER: nodus
      POSTGRES_PASSWORD: nodus-local-only
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./server/migrations/001_auth_tenants.sql:/docker-entrypoint-initdb.d/001_auth_tenants.sql:ro
      - ./server/migrations/002_tenant_key_envelopes.sql:/docker-entrypoint-initdb.d/002_tenant_key_envelopes.sql:ro
      - ./server/migrations/003_key_rotation_tasks.sql:/docker-entrypoint-initdb.d/003_key_rotation_tasks.sql:ro
      - ./server/migrations/004_tenant_asset_catalog.sql:/docker-entrypoint-initdb.d/004_tenant_asset_catalog.sql:ro
      - ./server/migrations/004_upload_control_plane.sql:/docker-entrypoint-initdb.d/004_upload_control_plane.sql:ro
      - ./server/migrations/005_upload_payloads.sql:/docker-entrypoint-initdb.d/005_upload_payloads.sql:ro
      - ./server/migrations/006_tenant_provisioning.sql:/docker-entrypoint-initdb.d/006_tenant_provisioning.sql:ro
      - ./server/migrations/007_organization_invitations.sql:/docker-entrypoint-initdb.d/007_organization_invitations.sql:ro
      - ./server/migrations/008_api_keys.sql:/docker-entrypoint-initdb.d/008_api_keys.sql:ro
      - ./server/migrations/009_public_idempotency.sql:/docker-entrypoint-initdb.d/009_public_idempotency.sql:ro
      - ./server/migrations/010_signed_webhooks.sql:/docker-entrypoint-initdb.d/010_signed_webhooks.sql:ro
      - ./server/migrations/011_asset_sharing.sql:/docker-entrypoint-initdb.d/011_asset_sharing.sql:ro
      - ./server/migrations/012_tenant_byos_storage_config.sql:/docker-entrypoint-initdb.d/012_tenant_byos_storage_config.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodus -d nodus_local_tests"]
      interval: 1s
      timeout: 3s
      retries: 30

